apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: demo
  labels:
    app: inventory
    sre-agent.dev/scenario: networkpolicy-block
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
        sre-agent.dev/scenario: networkpolicy-block
    spec:
      containers:
        - name: app
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports:
            - containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9898
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: demo
  labels:
    sre-agent.dev/scenario: networkpolicy-block
spec:
  selector:
    app: inventory
  ports:
    - port: 80
      targetPort: 9898
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: demo
  labels:
    app: storefront
    sre-agent.dev/scenario: networkpolicy-block
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
        sre-agent.dev/scenario: networkpolicy-block
    spec:
      containers:
        - name: client
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                if wget -q -T 2 -O /dev/null http://inventory.demo.svc.cluster.local/healthz; then
                  echo "inventory ok"
                else
                  echo "ERROR: request to inventory timed out"
                fi
                sleep 5
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-inventory-ingress
  namespace: demo
  labels:
    sre-agent.dev/scenario: networkpolicy-block
spec:
  podSelector:
    matchLabels:
      app: inventory
  policyTypes:
    - Ingress
  ingress:
    # Only "billing" pods may call inventory. "storefront" is not allowed.
    - from:
        - podSelector:
            matchLabels:
              app: billing
