# Local lab cluster: 1 control plane + 2 workers.
# NetworkPolicy scenarios need a CNI that enforces policies; if your kind version's default
# CNI does not, install Calico (see lab/README.md).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
